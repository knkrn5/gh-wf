name: sshpass-actions

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:


jobs:
  deploy-to-server:
    environment: PROD
    runs-on: ubuntu-latest

    steps:
      - name: Check for sshpass binary file
        run: |
          if ! command -v sshpass &> /dev/null; then
            echo "sshpass could not be found, installing..."
            sudo apt-get update
            sudo apt-get install -y sshpass
          else
            echo "sshpass is already installed."
            sshpass -V
          fi

      - run: echo 'console.log("Hello World!");' > index.js

      - name: Copy file to server
        env:
          SSHPASS: ${{ secrets.PCVM_SSH_PASSWORD }}
        run: |
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            ./server/dist/index.js \
            admin@pcvm.printcampus.in:/home/admin/index.js

  