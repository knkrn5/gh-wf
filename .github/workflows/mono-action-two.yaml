name: monorepo-actions-two
on:
  push:
    branches: ['master']

jobs:
  detect-changed-files:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}

    steps:
      - name: checkout code
        uses: actions/checkout@v7  
     
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'clients/**'
            server:
              - 'server/**'

  deploy-client:
    needs: detect-changed-files
    if: ${{ github.ref_name == 'master' && needs.detect-changed-files.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7



  


            
